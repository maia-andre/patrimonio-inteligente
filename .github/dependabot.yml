version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    ignore:
      # O Kotlin acompanha a versão embutida no AGP; sobe junto com ele, à mão.
      - dependency-name: "org.jetbrains.kotlin*"
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
      include: scope
