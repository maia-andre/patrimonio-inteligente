name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Testes unitarios + lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Valida o gradle-wrapper.jar contra os checksums oficiais antes de rodar.
      # Cache basico (actions/cache), sem o provedor proprietario da action.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Dar permissao ao gradlew
        run: chmod +x ./gradlew

      - name: Rodar testes unitarios
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Rodar lint (Android)
        run: ./gradlew lintDebug --no-daemon

      - name: Upload relatorios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  firmware:
    name: Firmware (compilacao ESP32)
    runs-on: ubuntu-latest
    env:
      ARDUINO_CLI_VERSION: 1.3.1
      ARDUINO_CLI_SHA256: 376428d7d45be640c00812a71612e1742edc2f5f9ee3742a2d6da7870e079588
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
      # Mesmo core e placa da bancada.
      ESP32_CORE: esp32:esp32@3.3.11
      FQBN: esp32:esp32:esp32doit-devkit-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar arduino-cli
        run: |
          curl -fsSL -o arduino-cli.tar.gz \
            "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          echo "${ARDUINO_CLI_SHA256}  arduino-cli.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf arduino-cli.tar.gz -C "$RUNNER_TEMP/bin" arduino-cli
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Instalar core ESP32
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install "$ESP32_CORE" --additional-urls "$ESP32_INDEX"

      - name: Compilar sketches
        run: |
          for sketch in firmware firmware/diag_r200 firmware/ponte_uart; do
            echo "::group::$sketch"
            arduino-cli compile --fqbn "$FQBN" --warnings default "$sketch"
            echo "::endgroup::"
          done
